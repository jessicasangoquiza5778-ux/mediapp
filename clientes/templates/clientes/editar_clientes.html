{% load static %}
{% include 'private/header.html' %}

<div class="main-panel">
    <div class="content-wrapper">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-lg-8">

                    <div class="card shadow-sm border-0">
                        <div class="card-header bg-warning text-dark py-3">
                            <h2 class="mb-0">
                                <i class="bi bi-pencil-square me-2"></i>
                                Editar Pacientes
                            </h2>
                        </div>

                        <div class="card-body p-4">
                            <form action="" method="post">
                                {% csrf_token %}

                                <div class="row g-3">

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Nombre</label>
                                        <input type="text"
                                               name="nombrePacientesEdit"
                                               class="form-control"
                                               value="{{ Pacientes.nombre_Pacientes }}"
                                               required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Apellido</label>
                                        <input type="text"
                                               name="apellidoPacientesEdit"
                                               class="form-control"
                                               value="{{ Pacientes.apellido_Pacientes }}"
                                               required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Cédula</label>
                                        <input type="text"
                                               name="cedulaPacientesEdit"
                                               class="form-control"
                                               value="{{ Pacientes.cedula_Pacientes }}"
                                               maxlength="10"
                                               required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Teléfono</label>
                                        <input type="text"
                                               name="telefonoPacientesEdit"
                                               class="form-control"
                                               value="{{ Pacientes.telefono_Pacientes }}"
                                               maxlength="10"
                                               required>
                                    </div>

                                    <div class="col-12">
                                        <label class="form-label fw-semibold">Dirección</label>
                                        <input type="text"
                                               name="direccionPacientesEdit"
                                               class="form-control"
                                               value="{{ Pacientes.direccion_Pacientes }}"
                                               required>
                                    </div>

                                    <div class="col-md-6">
                                        <label class="form-label fw-semibold">Estado</label>
                                        <select name="estadoPacientesEdit" class="form-select" required>
                                            <option value="activo"
                                                {% if Pacientes.estado_Pacientes == 'activo' %}selected{% endif %}>
                                                Activo
                                            </option>

                                            <option value="inactivo"
                                                {% if Pacientes.estado_Pacientes == 'inactivo' %}selected{% endif %}>
                                                Inactivo
                                            </option>
                                        </select>
                                    </div>

                                </div>

                                <hr class="my-4">

                                <div class="d-flex justify-content-end gap-2">
                                    <a href="{% url 'listar_Pacientes' %}"
                                       class="btn btn-outline-danger rounded-pill px-4">
                                        <i class="bi bi-x-circle me-1"></i>
                                        CANCELAR
                                    </a>
                                    <button class="btn btn-warning rounded-pill px-4">
                                        <i class="bi bi-check-circle me-1"></i>
                                        GUARDAR
                                    </button>
                                </div>

                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

{% include 'private/footer.html' %}
