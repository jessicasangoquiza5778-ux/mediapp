{% load static %}
{% include 'private/header.html' %}

<div class="container-fluid px-4">
    <h1 class="mt-4">Eliminar Doctor</h1>
    <div class="card mb-4">
        <div class="card-body">
            <p>¿Está seguro que desea eliminar a <strong>{{ doctor.nombre_doctor }} {{ doctor.apellido_doctor }}</strong>?</p>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Sí, Eliminar</button>
                <a href="{% url 'lista_doctores' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>

{% include 'private/footer.html' %}
